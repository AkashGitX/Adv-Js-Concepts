<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #333;
            padding: 15px 20px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .search-bar input {
            padding: 7px;
            border: none;
            border-radius: 4px;
        }

        .menu-btn {
            display: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Mobile View */
        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .menu-btn {
                display: block;
                position: absolute;
                right: 20px;
                top: 12px;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                margin-top: 15px;
            }

            .nav-links.active {
                display: flex;
            }

            .search-bar {
                margin-top: 15px;
                width: 100%;
            }

            .search-bar input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <!-- Logo -->
        <div class="logo">MyLogo</div>

        <!-- Mobile Toggle Button -->
        <button class="menu-btn" onclick="toggleMenu()">☰</button>

        <!-- Navigation Links -->
        <ul class="nav-links" id="navLinks">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search...">
        </div>

    </nav>

    <script>
        function toggleMenu() {
            var nav = document.getElementById("navLinks");
            nav.classList.toggle("active");
        }
    </script>

</body>

</html>
